[project]
name = "python-arch-wiki"
version = "0.1.1"
description = "A terminal interface for browsing the Arch Linux Wiki"
readme = "README.md"
authors = [
    { name = "Anton Kaplan", email = "anton.kaplan@live.ca" }
]
requires-python = ">=3.13"
dependencies = [
    "autocommand>=2.2.2",
    "bs4>=0.0.2",
    "lxml>=6.0.2",
    "platformdirs>=4.11.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.scripts]
python-arch-wiki = "python_arch_wiki.__main__:main"

[project.urls]
Homepage = "https://github.com/termctrlseq/python-arch-wiki"
Issues = "https://github.com/termctrlseq/python-arch-wiki/issues"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
"venvPath" = "."
"venv" = ".venv"
"pythonPlatform" = "Linux"
"typeCheckingMode" = "standard"

[tool.ruff]
line-length = 78
# Enumerate all fixed violations.
show-fixes = true
unsafe-fixes = true

[tool.ruff.lint]
# select = []
# ignore = []
